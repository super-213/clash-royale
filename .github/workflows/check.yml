name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - run: npm ci
      - run: uv sync --directory crawler --frozen
      - run: npm run build
      - run: npm test
      - run: uv run --directory crawler --frozen pytest
      - run: npm run test:integration
